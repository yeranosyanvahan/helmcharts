externalDatabase:
  username: user
  password: password
  cluster:
    name: postgres-public000-asset
    namespace: asset-public-postgres
ingress:
  enabled: true
  hostname: od308.web.miom.am
  wwwPrefix: false
  annotations:
    kubernetes.io/ingress.class: traefik
persistence:
  accessModes:
    - ReadWriteOnce
  size: 12Gi
  storageClass: local-path
odoo:
  init:
    adminPassword: admin
  odooConf: |-
    proxy_mode = True
    addons_path = /var/lib/odoo/extra-addons
    data_dir = /var/lib/odoo
  replicas: 1