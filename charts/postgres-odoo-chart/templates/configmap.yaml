apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-{{ .Release.Name }}-odoo-conf
  namespace: {{ .Release.Namespace }}
data:
  odoo.conf: |
    [options]
    proxy_mode = True
    addons_path = /var/lib/odoo/extra-addons
    data_dir = /var/lib/odoo
    db_host = localhost
    db_port = 5432
    db_user = odoo
    db_password = odoo
    db_name = odoo
    {{- if .Values.odoo.odooConfOptions }}
      {{- .Values.odoo.odooConfOptions | nindent 4 }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-{{ .Release.Name }}-pgbouncer-config
  namespace: {{ .Release.Namespace }}
data:
  pgbouncer.ini: |
    [databases]
    odoo = host={{ .Values.externalDatabase.cluster.name }}-rw.{{ .Values.externalDatabase.cluster.namespace }}.svc.cluster.local port=5432 dbname=odoo-{{ include "name" . }}-database user={{ .Values.externalDatabase.username }} password={{ .Values.externalDatabase.password }}
    postgres = host={{ .Values.externalDatabase.cluster.name }}-rw.{{ .Values.externalDatabase.cluster.namespace }}.svc.cluster.local port=5432 dbname=odoo-{{ include "name" . }}-database user={{ .Values.externalDatabase.username }} password={{ .Values.externalDatabase.password }}

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    pool_mode = transaction
    max_client_conn = 100
    default_pool_size = 20

  userlist.txt: |
    "odoo" "odoo"